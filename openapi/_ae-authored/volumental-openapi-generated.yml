components:
  schemas:
    PostApiV1RecommendationsRequest:
      type: object
      properties:
        scan_id:
          type: string
          description: The scan ID for which you want to get recommendations.
      required:
      - scan_id
    PostApiV1RecommendationsResponse:
      type: object
      properties:
        '200':
          type: string
          description: Recommendations were successfully retrieved. The response will contain recommendation data.
        '404':
          type: string
          description: The scan was not found.
        '401':
          type: string
          description: Authentication credentials were missing or invalid.
    GetApiV1ScansWebResponse:
      type: object
      properties:
        '200':
          type: string
          description: Scans were found. The response will contain an array of scan objects sorted by created_at descending. If no scans were
            found, an empty list will be returned.
        '400':
          type: string
          description: The request was malformed.
        '401':
          type: string
          description: Authentication credentials were missing or invalid.
        '500':
          type: string
          description: An unexpected error occurred on the server.
    GetApiV1SomeEndpointResponse:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        scans:
          type: object
          properties:
            left_length:
              type: number
            left_width:
              type: number
            left_instep_height:
              type: number
            right_length:
              type: number
            right_width:
              type: number
            right_instep_height:
              type: number
        meshes:
          type: object
          properties:
            left_foot:
              type: string
            right_foot:
              type: string
    PostOauthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
    PostV1AuthResponse:
      type: object
      properties:
        success:
          type: boolean
    GetV1TenantnameResponse:
      type: object
      properties:
        success:
          type: boolean
    GetV1BetaTenantnameResponse:
      type: object
      properties:
        product_id:
          type: string
        pos_id:
          type: string
        on_hand:
          type: integer
        updated_at:
          type: string
          format: date-time
    PatchV1BetaTenantnameResponse:
