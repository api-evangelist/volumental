aid: volumental

name: Volumental

image: https://volumental.com/hubfs/Volumental_1554%20copy.jpg

description: Volumental provides 3D foot scanning and shoe fitting technology for retailers, enabling fast and accurate size recommendations both
  in‑store and online. Founded in 2012 by PhD researchers and a former NASA rocket scientist, the company leverages a large dataset of foot scans
  to power AI‑driven fit engines, omnichannel tools, and analytics that improve conversion and reduce returns. Their solutions integrate with
  Shopify, other e‑commerce platforms, and offer SDKs for mobile scanning, serving thousands of stores worldwide.

